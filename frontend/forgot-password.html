<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - LuxeStay Hotel & Resort</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top" id="mainNav">
        <div class="container-fluid px-4 px-lg-5">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <div class="brand-icon">
                    <i class="fas fa-hotel"></i>
                </div>
                <div class="brand-text ms-2">
                    <div class="brand-name">LuxeStay</div>
                    <div class="brand-tagline">HOTEL & RESORT</div>
                </div>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index.html#rooms">Rooms</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index.html#amenities">Amenities</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index.html#contact">Contact</a>
                    </li>
                </ul>
                <div class="navbar-nav">
                    <a class="btn btn-gold" href="login.html">Sign In</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Forgot Password Section -->
    <section class="auth-section">
        <div class="auth-overlay"></div>
        <div class="container">
            <div class="row justify-content-center align-items-center min-vh-100">
                <div class="col-lg-5 col-md-7">
                    <div class="auth-card animate-fade-in">
                        <div class="auth-header text-center mb-4">
                            <div class="auth-icon mb-3">
                                <i class="fas fa-key"></i>
                            </div>
                            <h2 class="auth-title">Forgot Password?</h2>
                            <p class="auth-subtitle">No worries, we'll send you reset instructions</p>
                        </div>

                        <form id="forgotPasswordForm" class="auth-form">
                            <!-- Alert Container -->
                            <div id="alertContainer"></div>

                            <!-- Email Field -->
                            <div class="mb-4">
                                <label for="email" class="form-label">
                                    <i class="fas fa-envelope"></i> Email Address
                                </label>
                                <input type="email" class="form-control auth-input" id="email" 
                                       placeholder="Enter your registered email" required>
                                <small class="text-muted">
                                    We'll send a password reset link to this email
                                </small>
                            </div>

                            <!-- Submit Button -->
                            <button type="submit" class="btn btn-gold w-100 btn-lg mb-3" id="resetBtn">
                                <i class="fas fa-paper-plane"></i> Send Reset Link
                            </button>

                            <!-- Back to Login -->
                            <div class="text-center mt-4">
                                <a href="login.html" class="auth-link">
                                    <i class="fas fa-arrow-left"></i> Back to Login
                                </a>
                            </div>
                        </form>
                    </div>

                    <!-- Help Text -->
                    <div class="text-center mt-4" style="position: relative; z-index: 2;">
                        <p class="text-white">
                            <i class="fas fa-question-circle"></i> 
                            Need help? <a href="#" class="auth-link" style="color: var(--gold-light);">Contact Support</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner-border text-gold" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
