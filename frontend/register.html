<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | LumaStay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="LumaStay home">
      <span class="brand-mark">L</span>
      <span>Luma<span>Stay</span></span>
    </a>
    <nav class="main-nav" aria-label="Main navigation">
      <a href="index.html#stays">Stays</a>
      <a href="index.html#experiences">Experiences</a>
      <a href="index.html#journal">Journal</a>
    </nav>
    <div class="header-actions">
      <button class="icon-button" type="button" aria-label="Change language and currency">EN / USD</button>
      <a href="login.html" class="host-link">Sign in</a>
      <button class="profile-button" type="button" aria-label="Open account menu"><span class="profile-icon">◉</span><span class="menu-icon">☰</span></button>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <h1>Join LumaStay</h1>
          <p>Create an account to start booking</p>
        </div>

        <form id="registerForm" class="auth-form">
          <div id="alertContainer"></div>

          <div class="form-group">
            <label for="name">Full name</label>
            <input type="text" id="name" class="form-input" placeholder="Your full name" required>
          </div>

          <div class="form-group">
            <label for="email">Email address</label>
            <input type="email" id="email" class="form-input" placeholder="your@email.com" required>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-wrapper">
              <input type="password" id="password" class="form-input" placeholder="Create a password" required minlength="8">
              <button type="button" class="password-toggle" id="togglePassword">
                <span class="show-text">Show</span>
                <span class="hide-text" style="display: none;">Hide</span>
              </button>
            </div>
            <small class="form-hint">At least 6 characters</small>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm password</label>
            <div class="password-wrapper">
              <input type="password" id="confirmPassword" class="form-input" placeholder="Confirm your password" required>
              <button type="button" class="password-toggle" id="toggleConfirmPassword">
                <span class="show-text">Show</span>
                <span class="hide-text" style="display: none;">Hide</span>
              </button>
            </div>
          </div>

          <label class="checkbox-label" style="margin-top: 8px;">
            <input type="checkbox" id="agreeTerms" required>
            <span>I agree to the Terms &amp; Conditions and Privacy Policy</span>
          </label>

          <button type="submit" class="btn-primary" id="registerBtn">
            Create account
          </button>

          <p class="auth-footer">
            Already have an account? <a href="login.html" class="text-link-bold">Sign in</a>
          </p>
        </form>
      </div>

      <div class="auth-image">
        <img src="https://images.unsplash.com/photo-1571896349842-33c89424de2d?auto=format&fit=crop&w=800&q=80" alt="Mountain resort view">
        <div class="image-overlay">
          <p class="image-caption">
            <span class="note-dot"></span>
            Discover stays worth remembering
          </p>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/session.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
