<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | LumaStay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="LumaStay home">
      <span class="brand-mark">L</span>
      <span>Luma<span>Stay</span></span>
    </a>
    <nav class="main-nav" aria-label="Main navigation">
      <a href="index.html#stays">Stays</a>
      <a href="index.html#experiences">Experiences</a>
      <a href="index.html#journal">Journal</a>
    </nav>
    <div class="header-actions">
      <button class="icon-button" type="button" aria-label="Change language and currency">EN / USD</button>
      <a href="register.html" class="host-link">Create account</a>
      <button class="profile-button" type="button" aria-label="Open account menu"><span class="profile-icon">◉</span><span class="menu-icon">☰</span></button>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <h1>Welcome back</h1>
          <p>Sign in to continue your journey</p>
        </div>

        <form id="loginForm" class="auth-form">
          <div id="alertContainer"></div>

          <div class="form-group">
            <label for="email">Email address</label>
            <input type="email" id="email" class="form-input" placeholder="your@email.com" required>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-wrapper">
              <input type="password" id="password" class="form-input" placeholder="Enter your password" required>
              <button type="button" class="password-toggle" id="togglePassword">
                <span class="show-text">Show</span>
                <span class="hide-text" style="display: none;">Hide</span>
              </button>
            </div>
          </div>

          <div class="form-row">
            <label class="checkbox-label">
              <input type="checkbox" id="rememberMe">
              <span>Remember me</span>
            </label>
            <span class="text-secondary small">Use your registered account</span>
          </div>

          <button type="submit" class="btn-primary" id="loginBtn">
            Sign in
          </button>

          <p class="auth-footer">
            Don't have an account? <a href="register.html" class="text-link-bold">Sign up</a>
          </p>
          
          <p class="auth-footer mt-3">
            <small>Administrators sign in with their admin account.</small>
          </p>
        </form>
      </div>

      <div class="auth-image">
        <img src="https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=800&q=80" alt="Luxury hotel lobby">
        <div class="image-overlay">
          <p class="image-caption">
            <span class="note-dot"></span>
            Start your journey with LumaStay
          </p>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/session.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
