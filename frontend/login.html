<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | LumaStay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="LumaStay home">
      <span class="brand-mark">L</span>
      <span>Luma<span>Stay</span></span>
    </a>
    <nav class="main-nav" aria-label="Main navigation">
      <a href="index.html#stays">Stays</a>
      <a href="index.html#experiences">Experiences</a>
      <a href="index.html#journal">Journal</a>
    </nav>
    <div class="header-actions">
      <button class="icon-button" type="button" aria-label="Change language and currency">EN / USD</button>
      <a href="register.html" class="host-link">Create account</a>
      <button class="profile-button" type="button" aria-label="Open account menu"><span class="profile-icon">◉</span><span class="menu-icon">☰</span></button>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <h1>Welcome back</h1>
          <p>Sign in to continue your journey</p>
        </div>

        <form id="loginForm" class="auth-form">
          <div id="alertContainer"></div>

          <div class="form-group">
            <label for="email">Email address</label>
            <input type="email" id="email" class="form-input" placeholder="your@email.com" required>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-wrapper">
              <input type="password" id="password" class="form-input" placeholder="Enter your password" required>
              <button type="button" class="password-toggle" id="togglePassword">
                <span class="show-text">Show</span>
                <span class="hide-text" style="display: none;">Hide</span>
              </button>
            </div>
          </div>

          <div class="form-row">
            <label class="checkbox-label">
              <input type="checkbox" id="rememberMe">
              <span>Remember me</span>
            </label>
            <a href="forgot-password.html" class="text-link">Forgot password?</a>
          </div>

          <button type="submit" class="btn-primary" id="loginBtn">
            Sign in
          </button>

          <div class="divider">
            <span>or continue with</span>
          </div>

          <div class="social-buttons">
            <button type="button" class="btn-social">
              <svg width="18" height="18" viewBox="0 0 18 18"><path fill="currentColor" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/><path fill="currentColor" d="M9.003 18c2.43 0 4.467-.806 5.956-2.18L12.05 13.56c-.806.54-1.837.86-3.047.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9.003 18z"/><path fill="currentColor" d="M3.964 10.712c-.18-.54-.282-1.117-.282-1.71 0-.593.102-1.17.282-1.71V4.96H.957C.347 6.175 0 7.55 0 9.002c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="currentColor" d="M9.003 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.464.891 11.426 0 9.002 0 5.48 0 2.438 2.017.957 4.958L3.964 7.29c.708-2.127 2.692-3.71 5.036-3.71z"/></svg>
              Google
            </button>
            <button type="button" class="btn-social">
              <svg width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
              Facebook
            </button>
          </div>

          <p class="auth-footer">
            Don't have an account? <a href="register.html" class="text-link-bold">Sign up</a>
          </p>
          
          <p class="auth-footer mt-3">
            <a href="admin/dashboard.html" class="text-link"><small>Admin Login →</small></a>
          </p>
        </form>
      </div>

      <div class="auth-image">
        <img src="https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=800&q=80" alt="Luxury hotel lobby">
        <div class="image-overlay">
          <p class="image-caption">
            <span class="note-dot"></span>
            Start your journey with LumaStay
          </p>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/session.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
