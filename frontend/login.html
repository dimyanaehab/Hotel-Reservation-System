<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LuxeStay Hotel & Resort</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top" id="mainNav">
        <div class="container-fluid px-4 px-lg-5">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <div class="brand-icon">
                    <i class="fas fa-hotel"></i>
                </div>
                <div class="brand-text ms-2">
                    <div class="brand-name">LuxeStay</div>
                    <div class="brand-tagline">HOTEL & RESORT</div>
                </div>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index.html#rooms">Rooms</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index.html#amenities">Amenities</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index.html#contact">Contact</a>
                    </li>
                </ul>
                <div class="navbar-nav">
                    <a class="btn btn-gold" href="register.html">Sign Up</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Login Section -->
    <section class="auth-section">
        <div class="auth-overlay"></div>
        <div class="container">
            <div class="row justify-content-center align-items-center min-vh-100">
                <div class="col-lg-5 col-md-7">
                    <div class="auth-card animate-fade-in">
                        <div class="auth-header text-center mb-4">
                            <div class="auth-icon mb-3">
                                <i class="fas fa-user-circle"></i>
                            </div>
                            <h2 class="auth-title">Welcome Back</h2>
                            <p class="auth-subtitle">Sign in to your account</p>
                        </div>

                        <form id="loginForm" class="auth-form">
                            <!-- Alert Container -->
                            <div id="alertContainer"></div>

                            <!-- Email Field -->
                            <div class="mb-3">
                                <label for="email" class="form-label">
                                    <i class="fas fa-envelope"></i> Email Address
                                </label>
                                <input type="email" class="form-control auth-input" id="email" 
                                       placeholder="Enter your email" required>
                            </div>

                            <!-- Password Field -->
                            <div class="mb-3">
                                <label for="password" class="form-label">
                                    <i class="fas fa-lock"></i> Password
                                </label>
                                <div class="password-field">
                                    <input type="password" class="form-control auth-input" id="password" 
                                           placeholder="Enter your password" required>
                                    <button type="button" class="password-toggle" id="togglePassword">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Remember Me & Forgot Password -->
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="rememberMe">
                                    <label class="form-check-label" for="rememberMe">
                                        Remember me
                                    </label>
                                </div>
                                <a href="forgot-password.html" class="auth-link">Forgot Password?</a>
                            </div>

                            <!-- Submit Button -->
                            <button type="submit" class="btn btn-gold w-100 btn-lg mb-3" id="loginBtn">
                                <i class="fas fa-sign-in-alt"></i> Sign In
                            </button>

                            <!-- Divider -->
                            <div class="auth-divider">
                                <span>OR</span>
                            </div>

                            <!-- Social Login Buttons -->
                            <div class="social-login">
                                <button type="button" class="btn btn-social btn-google">
                                    <i class="fab fa-google"></i> Continue with Google
                                </button>
                                <button type="button" class="btn btn-social btn-facebook">
                                    <i class="fab fa-facebook-f"></i> Continue with Facebook
                                </button>
                            </div>

                            <!-- Sign Up Link -->
                            <div class="text-center mt-4">
                                <p class="mb-0">Don't have an account? 
                                    <a href="register.html" class="auth-link-bold">Sign Up</a>
                                </p>
                            </div>

                            <!-- Admin Login Link -->
                            <div class="text-center mt-3">
                                <a href="admin/login.html" class="auth-link-admin">
                                    <i class="fas fa-user-shield"></i> Admin Login
                                </a>
                            </div>
                        </form>
                    </div>

                    <!-- Features Below Card -->
                    <div class="auth-features mt-4">
                        <div class="row g-3">
                            <div class="col-4 text-center">
                                <div class="feature-item">
                                    <i class="fas fa-shield-alt"></i>
                                    <p>Secure</p>
                                </div>
                            </div>
                            <div class="col-4 text-center">
                                <div class="feature-item">
                                    <i class="fas fa-bolt"></i>
                                    <p>Fast</p>
                                </div>
                            </div>
                            <div class="col-4 text-center">
                                <div class="feature-item">
                                    <i class="fas fa-headset"></i>
                                    <p>24/7 Support</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner-border text-gold" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
