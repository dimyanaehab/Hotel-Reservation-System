<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Details | LumaStay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/hotel-details.css">
</head>
<body>

  <!-- ── HEADER ── -->
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="LumaStay home">
      <span class="brand-mark">L</span>
      <span>Luma<span>Stay</span></span>
    </a>
    <nav class="main-nav" aria-label="Main navigation">
      <a href="index.html#stays">Stays</a>
      <a href="index.html#destinations">Destinations</a>
      <a href="reviews.html">Reviews</a>
    </nav>
    <div class="header-actions">
      <span class="icon-button" aria-label="Language and currency">EN / EGP</span>
      <a class="host-link" href="login.html">Sign in</a>
      <button class="profile-button" type="button" aria-label="Open account menu">
        <span class="profile-icon">◉</span>
        <span class="menu-icon">☰</span>
      </button>
    </div>
  </header>

  <main>

    <!-- ── HERO — populated by hotel-details.js via IDs ── -->
    <section class="hotel-hero">
      <img
        src="https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1600&q=80"
        alt="Hotel exterior"
        class="hotel-hero-image"
      >
      <div class="hotel-hero-overlay" aria-hidden="true"></div>
      <div class="hotel-hero-content">
        <!-- IDs populated by hotel-details.js -->
        <h1 id="hotelName">LumaStay Hotel</h1>
        <p class="hotel-location" id="hotelLocation">A carefully selected destination</p>
        <p class="hotel-description" id="hotelDescription">Explore available room types and choose your dates.</p>
      </div>
    </section>

    <!-- ── ROOMS ── -->
    <section class="rooms-section">
      <div class="container">

        <div class="rooms-section-header">
          <div>
            <p class="eyebrow" style="margin-bottom:10px">Choose your stay</p>
            <h2>Available room types</h2>
          </div>
          <span style="font-size:13px;color:var(--warm-grey)">
            Hotel ID: <strong id="hotelIdLabel" style="color:var(--charcoal)"></strong>
          </span>
        </div>

        <!-- Alert — hotel-details.js uses id="pageMessage" -->
        <div id="pageMessage" class="alert d-none" role="alert"></div>

        <!-- Room cards injected by hotel-details.js -->
        <div id="roomTypes" class="row g-4"></div>

      </div>
    </section>

  </main>

  <!-- ── FOOTER ── -->
  <footer class="site-footer">
    <span>© 2026 LumaStay</span>
    <span>Thoughtful stays, everywhere.</span>
    <a href="reviews.html">Guest reviews ↗</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/session.js"></script>
  <script src="js/hotel-details.js"></script>
</body>
</html>
